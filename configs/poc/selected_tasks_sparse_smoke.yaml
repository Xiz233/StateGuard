  instruction: Can you enable the 'Do Not Track' feature in Chrome to enhance my online
    privacy?
  application: chrome
  category: chrome
  evaluator:
    postconfig:
    - type: chrome_inject_js
      parameters:
        js: if (document.activeElement && document.activeElement.blur) { document.activeElement.blur();
          }
        wait_for_load: false
    - type: sleep
      parameters:
        seconds: 1.0
    - type: launch
      parameters:
        command:
        - pkill
        - chrome
    - type: launch
      parameters:
        command:
        - google-chrome
        - --remote-debugging-port=1337
    - type: sleep
      parameters:
        seconds: 3
    func: exact_match
    result:
      type: enable_do_not_track
    expected:
      type: rule
      rules:
        expected: 'true'
