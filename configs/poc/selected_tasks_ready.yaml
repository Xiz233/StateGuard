- task_id: 6f81754e-285d-4ce0-b59e-af7edb02d108
  instruction: 'A certain railway company in Hong Kong uses a signaling system to
    keep track of trains in its railway system. Each line in the docx file represents
    a train calling at a station from 0600 to 1200 on 2022-09-22, and has the following
    format: time_HH:MM:SS, train_id, station_id, platform_no.. I want to remove duplicated
    train ids in order to know how many different trains are running from 0600 to
    1200. Could you help me on this? I am doing it manually and it is very inefficient.'
  application: libreoffice_writer
  category: writer
  evaluator:
    postconfig:
    - type: activate_window
      parameters:
        window_name: HK_train_record.docx - LibreOffice Writer
        strict: true
    - type: sleep
      parameters:
        seconds: 0.5
    - type: execute
      parameters:
        command:
        - python
        - -c
        - 'import pyautogui; import time; pyautogui.hotkey(''ctrl'', ''s''); time.sleep(0.5); '
    func: compare_unique_train_records
    result:
      type: vm_file
      path: /home/user/Desktop/HK_train_record.docx
      dest: HK_train_record.docx
    expected:
      type: cloud_file
