providers:
  # Primary Guard for v10 natural-failure experiments.
  stateguard_luna:
    type: openai_responses
    base_url: https://opencode.ai/zen/go/v1
    api_key_env: OPENCODE_GO_API_KEY
    model: gpt-5.6-luna
    temperature: 0.0
    timeout_seconds: 180
    max_retries: 3
    max_tokens: 4096
  # Retained comparison provider; historical configs may call stateguard_api.
  stateguard_qwen:
    type: openai_compatible
    base_url: https://opencode.ai/zen/go/v1
    api_key_env: OPENCODE_GO_API_KEY
    model: qwen3.7-plus
    temperature: 0.0
    timeout_seconds: 180
    max_retries: 3
    max_tokens: 4096
  stateguard_api:
    type: anthropic_compatible
    base_url: https://opencode.ai/zen/go/v1
    api_key_env: OPENCODE_GO_API_KEY
    model: qwen3.7-plus
    temperature: 0.0
    timeout_seconds: 180
    max_retries: 3
    max_tokens: 4096
  executor_qwen:
    type: openai_compatible
    base_url: ${EXECUTOR_BASE_URL}
    api_key_env: EXECUTOR_API_KEY
    model: ${EXECUTOR_MODEL}
roles:
  stateguard: {provider: stateguard_luna}
  task_compiler: {provider: stateguard_luna, enabled_for_poc: false}
  executor: {provider: executor_qwen}
runtime:
  max_total_steps: 50
  max_repair_cycles_per_fault: 3
